<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cardiac Risk Assessment — Student Project</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="layout">

  <!-- LEFT: context panel -->
  <aside class="context-panel">
    <div class="context-inner">
      <p class="eyebrow">AI Project</p>
      <h1>Heart Disease<br>Detection</h1>
      <p class="lede">Protype(Look of the website)</p>

      <svg class="ecg-line" viewBox="0 0 400 100" preserveAspectRatio="none">
        <polyline class="ecg-path" fill="none" stroke-width="2"
          points="0,50 40,50 55,50 65,20 75,80 85,10 95,50 110,50 150,50 165,50 175,35 185,65 195,50 220,50 260,50 275,50 285,20 295,80 305,10 315,50 330,50 400,50" />
      </svg>


      <p class="disclaimer">Educational demo only — not a diagnostic tool BY Chetanya, Arnav , Aniket , Tatsat.</p>
    </div>
  </aside>

  <!-- RIGHT: form panel -->
  <main class="form-panel">
    <form id="patient-form">
      <h2>Patient measurements</h2>

      <div class="field-grid">

        <label class="field">
          <span>Age</span>
          <input type="number" name="age" min="1" max="120" value="55" required>
        </label>

        <label class="field">
          <span>Sex</span>
          <select name="sex" required>
            <option value="1">Male</option>
            <option value="0">Female</option>
          </select>
        </label>

        <label class="field">
          <span>Chest pain type</span>
          <select name="cp" required>
            <option value="0">Type 0 — typical angina</option>
            <option value="1">Type 1 — atypical angina</option>
            <option value="2">Type 2 — non-anginal pain</option>
            <option value="3">Type 3 — asymptomatic</option>
          </select>
        </label>

        <label class="field">
          <span>Resting blood pressure (mm Hg)</span>
          <input type="number" name="trestbps" min="60" max="260" value="130" required>
        </label>

        <label class="field">
          <span>Cholesterol (mg/dl)</span>
          <input type="number" name="chol" min="80" max="700" value="240" required>
        </label>

        <label class="field">
          <span>Fasting blood sugar &gt;120 mg/dl</span>
          <select name="fbs" required>
            <option value="0">No</option>
            <option value="1">Yes</option>
          </select>
        </label>

        <label class="field">
          <span>Resting ECG result</span>
          <select name="restecg" required>
            <option value="0">Normal</option>
            <option value="1">ST-T wave abnormality</option>
            <option value="2">Left ventricular hypertrophy</option>
          </select>
        </label>

        <label class="field">
          <span>Max heart rate achieved</span>
          <input type="number" name="thalach" min="50" max="230" value="150" required>
        </label>

        <label class="field">
          <span>Exercise-induced angina</span>
          <select name="exang" required>
            <option value="0">No</option>
            <option value="1">Yes</option>
          </select>
        </label>

        <label class="field">
          <span>ST depression (oldpeak)</span>
          <input type="number" name="oldpeak" min="0" max="10" step="0.1" value="1.0" required>
        </label>

        <label class="field">
          <span>Slope of peak exercise ST segment</span>
          <select name="slope" required>
            <option value="0">Downsloping</option>
            <option value="1">Flat</option>
            <option value="2">Upsloping</option>
          </select>
        </label>

        <label class="field">
          <span>Major vessels colored (0–3)</span>
          <select name="ca" required>
            <option value="0">0</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
          </select>
        </label>

        <label class="field">
          <span>Thalassemia</span>
          <select name="thal" required>
            <option value="1">Normal</option>
            <option value="2">Fixed defect</option>
            <option value="3">Reversible defect</option>
          </select>
        </label>

      </div>

      <button type="submit">Assess risk</button>
    </form>

    <section id="result" class="result" hidden>
      <div class="result-inner">
        <p class="result-label" id="result-label"></p>
        <p class="result-prob"><span id="result-prob-value"></span><span class="result-prob-unit">% estimated probability</span></p>
      </div>
    </section>
  </main>

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
